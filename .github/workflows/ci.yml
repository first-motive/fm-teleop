name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]
  pull_request:
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]
  # Re-run on demand. A workflow that fails to load — a reusable workflow this one
  # calls not existing yet, say — produces a run GitHub refuses to retry, and an
  # empty commit cannot retrigger it either (paths-ignore skips a push that touched
  # no file). Without this, recovering needs a throwaway code change.
  workflow_dispatch:

# Standalone build: clone this repo, pull its .repos siblings + externals, then
# colcon build + test in a Humble container. Proves the package stands on its own
# outside the fm-ros2 monorepo.
jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash of
  # their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # No server-side branch protection exists on this repo, so a push straight to
  # main is possible. The rendered pre-push hook refuses one locally; this
  # notices the ones it cannot refuse and opens an issue naming the commit.
  # The called job guards on push-to-default itself, so it skips on a PR.
  # The permissions block is scoped to this job alone: opening the issue needs
  # issues:write, which no other job here is granted.
  tripwire:
    uses: first-motive/.github/.github/workflows/direct-push-tripwire.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read

  # The piped-curl front door check lives in first-motive/.github.
  selftest:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main

  # The colcon block lives in first-motive/.github. The manifest pulls siblings
  # whose own deps do not resolve in CI, so rosdep is advisory and the build is the
  # gate.
  build-test:
    uses: first-motive/.github/.github/workflows/ros2-build-test.yml@main
    with:
      checkout-path: src/fm-teleop
      repos-file: fm-teleop.repos
      package-prefix: ""
      rosdep-strict: false

  image:
    name: build + publish image (FROM fm-robot layer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # fm-render:begin qemu-binfmt sha256:83c33276dedb113f2237a8de56620ea914da38d4afd9f70c28c44267553b6375 — rendered by the First Motive render plane — edit the upstream source, not this file
      # Pin a recent qemu: the default ships an older build whose arm64 user-mode
      # emulation segfaults on heavy glibc postinst — libc-bin's ldconfig dies
      # with SIGSEGV and the layer fails with exit 100. fm-teleop hit it first;
      # fm-robot hit it the moment an apt layer grew. Newer qemu emulates that
      # path cleanly. One pin for every repo that emulates arm64 in CI.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
      # fm-render:end qemu-binfmt

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GHCR — to pull the private fm-robot base FROM and to push this
      # layer (the Dockerfile is FROM ghcr.io/first-motive/fm-robot:humble).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build multi-arch (arm64 + amd64). Publish to GHCR only on main — branch and
      # PR runs build to validate without pushing.
      - name: Build + publish the teleop image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/first-motive/fm-teleop:humble
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # joy_to_servo spins waiting on /joy and publishes nothing until a message
  # arrives, so "still running" was never evidence it worked. The smoke drives it
  # instead: a /joy stream alongside run.sh, then assert a twist comes out the other
  # side. That is the whole job of this node, and it is now the thing CI checks.
  #
  # No repos-file: fm-teleop.repos pulls only docker/, which the native path does
  # not use.
  smoke:
    name: smoke run.sh (native headless)
    uses: first-motive/.github/.github/workflows/ros2-smoke.yml@main
    with:
      launch: >-
        ros2 topic pub -r 20 /joy sensor_msgs/msg/Joy
        "{axes: [0.0, 1.0, 1.0, 0.0, 0.0, 1.0], buttons: [0, 0, 0, 0, 0, 0]}"
        & ./run.sh --native
      expect-nodes: /joy_to_servo
      expect-topics: /servo_node/delta_twist_cmds
