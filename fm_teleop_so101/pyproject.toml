[project]
name = "fm-teleop-so101"
version = "0.1.0"
description = "Always-on LeRobot stack for an SO-101 leader/follower pair"
requires-python = ">=3.12"
dependencies = ["lerobot[feetech,dataset]==0.6.1"]

[project.scripts]
fm-teleop-so101 = "fm_teleop_so101.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_teleop_so101"]
